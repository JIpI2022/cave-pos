# ---------------------------------------------------------------------------
#  Deploiement automatique sur GitHub Pages
#
#  Se declenche a chaque « push » sur la branche main (et manuellement depuis
#  l onglet Actions). Les cles Supabase sont lues dans les SECRETS du depot :
#  Settings > Secrets and variables > Actions > New repository secret
#    - VITE_SUPABASE_URL
#    - VITE_SUPABASE_ANON_KEY
# ---------------------------------------------------------------------------
name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits necessaires a la publication Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on laisse finir celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Controles de securite
        run: npm run audit:securite

      - name: Verification des types
        run: npm run typecheck

      - name: Tests automatises (calculs de caisse et de stock)
        run: npm test

      - name: Compilation de l application
        env:
          # https://<utilisateur>.github.io/<depot>/  ->  base = /<depot>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY absents :"
            echo "::warning::l application affichera l ecran « Configuration Supabase manquante »."
          else
            # Verifie la FORME de l'adresse sans jamais l'afficher (GitHub
            # masquerait la valeur, et la journaliser n'aurait pas de sens).
            # Attendu : https://<reference-du-projet>.supabase.co
            # Erreur classique : coller l'adresse du tableau de bord
            # (https://supabase.com/dashboard/project/...), ce qui rend le
            # serveur injoignable depuis le navigateur.
            if ! printf '%s' "$VITE_SUPABASE_URL" \
                 | grep -qE '^https://[a-z0-9]{16,24}\.supabase\.(co|in)/?$'; then
              echo "::error::VITE_SUPABASE_URL n'a pas la forme attendue."
              echo "::error::Attendu : https://<reference>.supabase.co"
              echo "::error::Reference visible dans Supabase > Project Settings > Data API,"
              echo "::error::ou dans l'adresse de votre tableau de bord apres /project/."
              exit 1
            fi
            # La cle publishable commence par « sb_publishable_ », l'ancienne
            # cle anon est un jeton JWT commencant par « eyJ ». Une cle
            # secrete (« sb_secret_ ») n'a RIEN a faire dans une page web.
            case "$VITE_SUPABASE_ANON_KEY" in
              sb_secret_*|*service_role*)
                echo "::error::VITE_SUPABASE_ANON_KEY semble etre une cle SECRETE."
                echo "::error::Cette cle contourne toutes les protections : ne la publiez jamais."
                echo "::error::Utilisez la cle « Publishable » (sb_publishable_...) du projet."
                exit 1 ;;
              sb_publishable_*|eyJ*) : ;;
              *)
                echo "::warning::VITE_SUPABASE_ANON_KEY n'a pas une forme connue"
                echo "::warning::(attendu sb_publishable_... ou eyJ...). Verifiez-la." ;;
            esac
          fi
          npm run build

      - name: Page de repli 404 (liens profonds)
        # L application utilise HashRouter : ce fichier n est qu une securite
        # supplementaire si quelqu un ouvre une URL sans « # ».
        run: cp dist/index.html dist/404.html

      # Prerequis : Settings > Pages > Source = « GitHub Actions ».
      # Cette activation ne peut pas etre faite par le workflow : creer un site
      # Pages exige un droit d administration que le jeton d Actions n a pas.
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoi de l artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
